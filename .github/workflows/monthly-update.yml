name: Monthly Energy Rate Update

on:
  schedule:
    # Run at 9 AM EST on the 1st of every month
    - cron: '0 14 1 * *'  # 14:00 UTC = 9:00 EST
  workflow_dispatch:      # Allow manual triggers from GitHub UI

jobs:
  update-rates:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Need write access to push changes
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install pandas openpyxl requests beautifulsoup4
        
    - name: Generate updated energy data
      run: |
        python complete_energy_parser.py
        
    - name: Create GitHub Pages index
      run: |
        cat > index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>NH Energy Rate Comparison</title>
            <meta http-equiv="refresh" content="0; url=outputs/html/energy_rates.html">
            <style>
                body {
                    font-family: Arial, sans-serif;
                    text-align: center;
                    padding: 50px;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    color: white;
                }
                .container {
                    background: rgba(255,255,255,0.1);
                    padding: 30px;
                    border-radius: 10px;
                    max-width: 500px;
                    margin: 0 auto;
                }
                a {
                    color: #fff;
                    text-decoration: none;
                    font-weight: bold;
                }
                a:hover {
                    text-decoration: underline;
                }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>⚡ NH Energy Rate Comparison</h1>
                <p>Redirecting to the latest energy rate comparison...</p>
                <p>If you are not redirected automatically, <a href="outputs/html/energy_rates.html">click here</a>.</p>
                <p><small>Last updated: $(date '+%B %d, %Y')</small></p>
            </div>
        </body>
        </html>
        EOF
        
    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "🤖 Auto-update energy rates - $(date '+%Y-%m-%d %H:%M:%S')"
        git push
        
    - name: No changes detected
      if: steps.verify-changed-files.outputs.changed == 'false'
      run: |
        echo "ℹ️ No changes detected in energy rates data"
